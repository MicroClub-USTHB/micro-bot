[project]
name = "mcclub-rag"
version = "0.1.0"
description = "RAG chatbot for the MC Club RAG Chatbot Challenge"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]~=0.143",
    "pydantic-settings~=2.15",
    "openai>=3.27",
    "qdrant-client~=1.19",
    "fastembed>=0.9",
    "onnxruntime>=1.31",
    "tokenizers>=0.23",
    "numpy>=2.0",
    "xberg==1.3.6",
    "trafilatura~=2.3",
    "httpx~=0.28",
    "py3langid~=0.4",
    "structlog>=26.1",
    "charset-normalizer~=3.5",
    "lxml~=6.1",
    "pillow~=12.3",  # deskew of photographed pages before OCR (ingest/deskew.py)
]

[dependency-groups]
dev = [
    "openpyxl~=3.1",
    "pypdf~=6.20",
    "pytest~=9.1",
    "pytest-asyncio~=1.4",
    "python-docx~=1.2",
    "ruff~=0.16",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "ocr: needs Tesseract traineddata (ara, fra, eng) under TESSDATA_PREFIX (auto-applied to tests using the tessdata_dir fixture)",
    "tokenizer: needs the embedder tokenizer.json (auto-applied to tests using the tokenizer_path fixture)",
    "embedder: needs the embedder ONNX model and BM25 stopwords (auto-applied to tests using the onnx_path or real_bm25_dir fixtures)",
    "reranker: needs the reranker ONNX model under MODELS_DIR/reranker (auto-applied to tests using the reranker_dir fixture)",
]
