# Profile B of the 4 GB / 2-core VPS simulation: raise the chat rate limit so a load run measures
# the hardware instead of the per-IP limiter. Layer it last:
#
#   docker compose -f docker-compose.yml -f docker-compose.simulation.yml \
#     -f docker-compose.simulation.capacity.yml up -d
#
# Why it exists: the app allows 20 requests per 60 s per client IP, and every simulated user reaches
# the server from 127.0.0.1, so one shared source IP would answer 429 long before the 2 CPUs or the
# 4 GB are under pressure. Raising the limit measures capacity; it is a test-only setting and NOT a
# production-recommended security configuration. Profile A (this file absent) is the run that shows
# the shipped policy's real behaviour.
#
# Test-only. Nothing here is a production default; .env and .env.example stay untouched.
services:
  app:
    environment:
      CHAT_RATE_LIMIT_REQUESTS: "1000"
      CHAT_RATE_LIMIT_WINDOW_S: "60"
