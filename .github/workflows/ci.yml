name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.12.24"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      # Only the dev group: ruff comes from uv.lock without pulling the heavy runtime deps.
      - name: Ruff lint
        run: uv run --locked --only-group dev ruff check --output-format=github .

      - name: Ruff format check
        run: uv run --locked --only-group dev ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests that run without model files
        run: uv run pytest -m "not ocr and not tokenizer and not embedder"

  test-ocr:
    name: Tests (needs tessdata / tokenizer / embedder)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESSDATA_PREFIX: ${{ github.workspace }}/models/tessdata
      INGEST_CHUNK_TOKENIZER_PATH: ${{ github.workspace }}/models/embedder/tokenizer.json
      MODELS_DIR: ${{ github.workspace }}/models
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache OCR traineddata
        uses: actions/cache@v4
        with:
          path: models/tessdata
          key: tessdata-${{ hashFiles('scripts/download_models.py') }}

      - name: Download OCR traineddata (ara, fra, eng; sha256-verified)
        run: uv run python scripts/download_models.py --only tessdata --dest models/tessdata

      - name: Cache embedder (tokenizer + ONNX) and BM25 stopwords
        uses: actions/cache@v4
        with:
          path: |
            models/embedder
            models/bm25
          key: embedder-${{ hashFiles('src/mcclub_rag/retrieval/registry.py') }}

      - name: Download embedder and BM25 files (pinned revisions, sha256-verified)
        env:
          HF_HUB_OFFLINE: "0"
        run: |
          uv run python scripts/download_models.py --only embedder --dest models/embedder
          uv run python scripts/download_models.py --only bm25 --dest models/bm25

      - name: Tests that need tessdata, the tokenizer or the embedder
        run: uv run pytest -m "ocr or tokenizer or embedder"
